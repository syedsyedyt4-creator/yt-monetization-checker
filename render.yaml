services:
  - type: web
    name: yt-monetization-checker
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADSENSE_PUB_ID
        value: ca-pub-8046276779791670
      - key: ADS_ENABLED
        value: true
